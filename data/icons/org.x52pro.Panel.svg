<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f46"/>
      <stop offset="1" stop-color="#1e2227"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102b18"/>
      <stop offset="1" stop-color="#07160c"/>
    </linearGradient>
  </defs>

  <!-- throttle base -->
  <rect x="14" y="44" width="100" height="66" rx="10" fill="url(#body)"/>
  <rect x="14" y="44" width="100" height="66" rx="10" fill="none" stroke="#0b0d10" stroke-width="2"/>

  <!-- MFD -->
  <rect x="30" y="56" width="68" height="30" rx="4" fill="url(#lcd)" stroke="#0a120c" stroke-width="1.5"/>
  <g stroke="#74ff88" stroke-width="2" stroke-linecap="round" opacity="0.95">
    <line x1="36" y1="63" x2="58" y2="63"/>
    <line x1="36" y1="70" x2="68" y2="70"/>
    <line x1="36" y1="77" x2="52" y2="77"/>
  </g>
  <circle cx="88" cy="63" r="2.2" fill="#74ff88"/>

  <!-- mode switch -->
  <circle cx="88" cy="86" r="7" fill="#2a2f36" stroke="#0b0d10" stroke-width="1.5"/>
  <circle cx="88" cy="83" r="2.4" fill="#e6e6e6"/>

  <!-- throttle grip -->
  <rect x="46" y="6" width="30" height="42" rx="9" fill="#2b3037" stroke="#0b0d10" stroke-width="2"/>
  <rect x="52" y="12" width="18" height="6" rx="3" fill="#151a1f"/>
  <circle cx="61" cy="28" r="5" fill="#151a1f"/>
  <rect x="56" y="38" width="10" height="4" rx="2" fill="#ff3b30"/>
</svg>
